<div th:fragment="content">


  <!-- Greeting -->
  <p style="margin: 0 0 16px 0; font-size: 16px; line-height: 24px; color: #52525b;">
    <span th:text="#{email.greeting(${user.username})}">Hello,</span>
  </p>

  <!-- Instruction -->
  <p style="margin: 0 0 24px 0; font-size: 16px; line-height: 24px; color: #52525b;">
    <span th:text="#{reset.password.email.text}">To reset your password, click the button below:</span>
  </p>

  <!-- CTA Button -->
  <div style="margin: 0 0 32px 0; text-align: center;">
    <a th:href="@{|${baseUrl}/reset-password?resetCode=${user.resetCode}|}"
      style="display: inline-block; background-color: #18181b; color: #ffffff; text-decoration: none; padding: 12px 32px; border-radius: 8px; font-weight: 600; font-size: 16px;"
      th:text="#{reset.password.email.button.text}">
      Reset Password
    </a>
  </div>

  <!-- Expiration Note -->
  <p style="margin: 0 0 30px 0; font-size: 14px; line-height: 20px; color: #71717a; text-align: center;">
    <span th:text="#{reset.password.expires.tip}">This link will expire in 24 hours.</span>
  </p>

  <!-- Divider -->
  <div style="height: 1px; background-color: #e4e4e7; width: 100%; margin-bottom: 20px;"></div>

  <!-- Ignore Tip -->
  <p style="margin: 0; font-size: 13px; line-height: 20px; color: #71717a; text-align: center;">
    <span th:text="#{reset.password.ignore.tip(${user.email})}">If you didn’t request this, please ignore this
      email.</span>
  </p>
</div>
