<div th:fragment="content" style="margin:0;padding:0;font-family:Arial,Helvetica,sans-serif;color:#000;">
  <table cellpadding="0" cellspacing="0" border="0" style="width:100%;background:#ffffff;">
    <tr>
      <td>
        <table cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:600px;background:#ffffff;">
          <tr>
            <td style="padding:20px 24px 8px;font-size:20px;font-weight:700;color:#000;"
              th:text="#{email.greeting(${user.username})}">
              Hello User,
            </td>
          </tr>
          <tr>
            <td style="padding:0 24px 16px;font-size:16px;color:#000;" th:text="#{reset.password.email.text}">
              To reset your password, click the button below:
            </td>
          </tr>
          <tr>
            <td style="padding:8px 24px 24px;text-align:center;">
              <a th:href="@{|${baseUrl}/reset-password?resetCode=${user.resetCode}|}"
                style="display:inline-block;padding:14px 28px;font-size:16px;font-weight:700;background:#000;color:#fff;text-decoration:none;border:2px solid #000;border-radius:0;"
                th:text="#{reset.password.email.button.text}">
                Reset Password
              </a>
            </td>
          </tr>
          <tr>
            <td style="padding:0 24px 20px;font-size:14px;font-weight:700;color:#000;"
              th:text="#{reset.password.expires.tip}">
              This link will expire in 24 hours.
            </td>
          </tr>
          <tr>
            <td style="padding:0 24px 24px;font-size:13px;color:#000;"
              th:text="#{reset.password.ignore.tip(${user.email})}">
              If you didn’t request this, please ignore this email.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</div>
