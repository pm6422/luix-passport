<div th:fragment="content">


  <!-- Greeting -->
  <p style="margin: 0 0 16px 0; font-size: 16px; line-height: 24px; color: #52525b;">
    <span th:text="#{email.greeting(${args[1]})}">Hello,</span>
  </p>

  <!-- Invitation Text -->
  <p style="margin: 0 0 16px 0; font-size: 16px; line-height: 24px; color: #52525b;">
    <span th:text="#{team.invitation.email.text1(${args[2]}, ${args[0]})}">You have been invited to join a
      team.</span>
  </p>
  <p style="margin: 0 0 24px 0; font-size: 16px; line-height: 24px; color: #52525b;">
    <span th:text="#{team.invitation.email.text2}">To accept this invitation, please register an account.</span>
  </p>

  <!-- CTA Button -->
  <div style="margin: 0 0 32px 0; text-align: center;">
    <a th:href="@{|${baseUrl}/sign-up?email=${args[1]}|}"
      style="display: inline-block; background-color: #18181b; color: #ffffff; text-decoration: none; padding: 12px 32px; border-radius: 8px; font-weight: 600; font-size: 16px;"
      th:text="#{team.invitation.email.button.text}">
      Register Account
    </a>
  </div>

  <!-- Invitation Details Box -->
  <div
    style="background-color: #f4f4f5; border: 1px solid #e4e4e7; border-radius: 8px; padding: 20px; margin-bottom: 30px;">
    <p
      style="margin: 0 0 8px 0; font-size: 14px; color: #52525b; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;">
      Invitation Details</p>
    <table border="0" cellpadding="0" cellspacing="0" width="100%">
      <tr>
        <td style="padding: 4px 0; font-size: 14px; color: #71717a; width: 80px;">Team:</td>
        <td style="padding: 4px 0; font-size: 14px; color: #18181b; font-weight: 500;">[[${args[0]}]]</td>
      </tr>
      <tr>
        <td style="padding: 4px 0; font-size: 14px; color: #71717a;">Inviter:</td>
        <td style="padding: 4px 0; font-size: 14px; color: #18181b; font-weight: 500;">[[${args[2]}]]</td>
      </tr>
      <tr>
        <td style="padding: 4px 0; font-size: 14px; color: #71717a;">Expires:</td>
        <td style="padding: 4px 0; font-size: 14px; color: #18181b; font-weight: 500;">[[${args[4]}]]</td>
      </tr>
    </table>
  </div>

  <!-- Divider -->
  <div style="height: 1px; background-color: #e4e4e7; width: 100%; margin-bottom: 20px;"></div>

  <!-- Security Note -->
  <p style="margin: 0; font-size: 13px; line-height: 20px; color: #71717a; text-align: center;"
    th:text="#{team.invitation.ignore.tip}">
    If you did not expect this invitation, please ignore this email.
  </p>
</div>
