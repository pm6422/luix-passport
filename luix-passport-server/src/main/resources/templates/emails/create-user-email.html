<div th:fragment="content" style="margin:0;padding:0;font-family:Arial,Helvetica,sans-serif;color:#111827;">
  <table cellpadding="0" cellspacing="0" border="0" style="width:100%;background:#ffffff;">
    <tr>
      <td>
        <table cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:600px;background:#ffffff;">
          <tr>
            <td style="padding:20px 24px 8px;font-size:20px;font-weight:700;color:#111827;">
              <span th:text="#{email.greeting(${user.username})}">Hello User,</span>
            </td>
          </tr>
          <tr>
            <td style="padding:0 24px 16px;font-size:16px;color:#374151;">
              <span th:text="#{create.user.email.text}">Your account has been successfully created. To set your password, click the button below:</span>
            </td>
          </tr>
          <tr>
            <td style="padding:8px 24px 24px;text-align:center;">
              <a th:href="@{|${baseUrl}/#/reset-password?resetCode=${user.resetCode}|}"
                 style="display:inline-block;padding:14px 28px;font-size:16px;font-weight:700;background:#6d28d9;color:#ffffff;text-decoration:none;border-radius:8px;">
                <span th:text="#{create.user.email.button.text}">Set Password</span>
              </a>
            </td>
          </tr>
          <tr>
            <td style="padding:0 24px 24px;font-size:13px;color:#6b7280;">
              <span th:text="#{reset.password.ignore.tip(${user.email})}">If you did not expect this email, please contact support or ignore it.</span>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</div>
