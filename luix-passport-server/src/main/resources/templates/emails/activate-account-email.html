<div th:fragment="content" style="margin:0;padding:0;font-family:Arial,Helvetica,sans-serif;color:#000;">
  <table cellpadding="0" cellspacing="0" border="0" style="width:100%;background:#ffffff;">
    <tr>
      <td>
        <table cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:600px;background:#ffffff;">
          <tr>
            <td style="padding:20px 24px 8px;font-size:20px;font-weight:700;color:#000;">
              <span th:text="#{email.greeting(${user.username})}">Hello User,</span>
            </td>
          </tr>
          <tr>
            <td style="padding:0 24px 16px;font-size:16px;color:#000;">
              <span th:text="#{activate.account.email.text}">Please activate your account by clicking the button below:</span>
            </td>
          </tr>
          <tr>
            <td style="padding:8px 24px 24px;text-align:center;">
              <a th:href="@{|${baseUrl}/activate-account?code=${user.activationCode}|}"
                 style="display:inline-block;padding:14px 28px;font-size:16px;font-weight:700;background:#000;color:#fff;text-decoration:none;border:2px solid #000;border-radius:0;">
                <span th:text="#{activate.account.email.button.text}">Activate Account</span>
              </a>
            </td>
          </tr>
          <tr>
            <td style="padding:0 24px 20px;font-size:13px;color:#000;">
              <span th:text="#{activate.account.ignore.tip(${user.email})}">If you did not request this account, please ignore this email.</span>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</div>
