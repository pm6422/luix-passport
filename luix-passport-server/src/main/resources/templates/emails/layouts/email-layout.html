<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title}">Luix Passport</title>
</head>
<body style="margin:0;padding:0;background:#f5f7fa;color:#111827;font-family:Arial,Helvetica,sans-serif;line-height:1.5;">
<table width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f5f7fa;">
  <tr>
    <td align="center" style="padding:24px 12px;">
      <table cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:600px;background:#ffffff;border:1px solid #e5e7eb;border-radius:8px;">
        <tr>
          <td style="background:#7c3aed;padding:16px 24px;text-align:center;border-radius:8px 8px 0 0;">
            <a th:href="${domain}" style="text-decoration:none;">
              <span th:text="${title}" style="color:#ffffff;font-size:18px;font-weight:700;">Luix Passport</span>
            </a>
          </td>
        </tr>
        <tr>
          <td style="padding:24px;">
            <div th:replace="${contentFragment} :: content"></div>
          </td>
        </tr>
        <tr>
          <td style="background:#f3f4f6;padding:16px 24px;text-align:center;border-radius:0 0 8px 8px;">
            <span style="color:#6b7280;font-size:12px;">© 2025 Luix Passport</span>
          </td>
        </tr>
      </table>
    </td>
  </tr>
  </table>
</body>
</html>
