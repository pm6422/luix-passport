<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title}">Luix Passport</title>
</head>
<body style="margin:0;padding:0;background:#fff;color:#000;font-family:Arial,Helvetica,sans-serif;line-height:1.5;">
<table width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#fff;">
  <tr>
    <td align="center" style="padding:24px 12px;">
      <table cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:600px;background:#fff;border:2px solid #000;border-radius:0;">
        <tr>
          <td style="background:#000;padding:16px 24px;text-align:center;">
            <a th:href="${domain}" style="text-decoration:none;">
              <span th:text="${title}" style="color:#fff;font-size:18px;font-weight:700;">Luix Passport</span>
            </a>
          </td>
        </tr>
        <tr>
          <td style="padding:24px;color:#000;">
            <div th:replace="${contentFragment} :: content"></div>
          </td>
        </tr>
        <tr>
          <td style="padding:12px 24px;text-align:center;border-top:2px solid #000;color:#000;">
            <span style="font-size:12px;">© 2025 Luix Passport</span>
          </td>
        </tr>
      </table>
    </td>
  </tr>
  </table>
</body>
</html>
