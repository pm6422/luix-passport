<div th:fragment="content">

  <!-- Greeting -->
  <p style="margin: 0 0 16px 0; font-size: 16px; line-height: 24px; color: #52525b;">
    <span th:text="#{email.greeting(${user.username})}">Hey louis,</span>
  </p>

  <!-- Notification Text -->
  <p style="margin: 0 0 24px 0; font-size: 16px; line-height: 24px; color: #52525b;">
    <span th:text="#{changed.password.email.text(${user.email})}">The password for your Luix Passport account {0} was recently changed.</span>
  </p>

  <!-- Warning Box -->
  <div
    style="background-color: #fef2f2; border: 1px solid #fee2e2; border-radius: 8px; padding: 16px; margin-bottom: 30px;">
    <p style="margin: 0; font-size: 14px; color: #991b1b; font-weight: 500; text-align: center;">
      <span th:text="#{changed.password.contact.tip}">If you didn’t make this change, please contact us
        immediately.</span>
    </p>
  </div>

  <!-- Divider -->
  <div style="height: 1px; background-color: #e4e4e7; width: 100%; margin-bottom: 20px;"></div>

  <!-- Ignore Tip -->
  <p style="margin: 0; font-size: 13px; line-height: 20px; color: #71717a; text-align: center;">
    <span th:text="#{changed.password.ignore.tip(${user.email})}">If you didn’t make this change, please contact us immediately.</span>
  </p>
</div>
