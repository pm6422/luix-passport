<div th:fragment="content">

  <!-- Greeting -->
  <p style="margin: 0 0 16px 0; font-size: 16px; line-height: 24px; color: #52525b;">
    <span th:text="#{email.greeting(${user.username})}">Hey louis,</span>
  </p>

  <!-- Instruction -->
  <p style="margin: 0 0 24px 0; font-size: 16px; line-height: 24px; color: #52525b;">
    <span th:text="#{verification.code.email.text}">Your verification code:</span>
  </p>

  <!-- Code Box -->
  <div style="margin: 0 0 24px 0; text-align: center;">
    <div
      style="display: inline-block; background-color: #f4f4f5; border-radius: 8px; border: 1px solid #e4e4e7; padding: 16px 32px;">
      <span
        style="font-family: 'Courier New', Courier, monospace; font-size: 32px; font-weight: 700; letter-spacing: 4px; color: #18181b; display: block;"
        th:text="${user.verificationCode}">YERJFM</span>
    </div>
  </div>

  <!-- Expiration Note -->
  <p style="margin: 0 0 30px 0; font-size: 14px; line-height: 20px; color: #71717a; text-align: center;">
    <span th:text="#{verification.code.expires.tip}">This code will expire in 15 minutes.</span>
  </p>

  <!-- Divider -->
  <div style="height: 1px; background-color: #e4e4e7; width: 100%; margin-bottom: 20px;"></div>

  <!-- Security Note -->
  <p style="margin: 0; font-size: 13px; line-height: 20px; color: #71717a; text-align: center;">
    If you did not request this code, please ignore this email. Your account remains secure.
  </p>
</div>
